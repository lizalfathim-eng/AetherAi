{% extends 'admin/home_index.html' %}
{% block body %}
  <div class="container mt-5">
    <h4 class="mb-4">Send Reply</h4>
    <form action="/myapp/send_reply_post/#a" method="post">
        {% csrf_token %}
      

      <!-- Complaint Text -->
      <div class="mb-3"><input type="hidden" name="id" value="{{ id }}">
        <label for="complaint" class="form-label">Reply</label>
        <textarea class="form-control" id="complaint" name="reply" rows="4" placeholder="Write your reply here..." required></textarea>
      </div>

      <!-- Optional File Upload -->

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary">Send Reply</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{#</body>#}
{#</html>#}
{% endblock %}
